name: Drop Reminder Emails

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call drop reminder cron endpoint
        run: |
          curl -sf -X GET "https://wheydrop.fitskins.de/api/cron/drop-reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
